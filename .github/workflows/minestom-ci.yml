name: Minestom

# Every push builds spark-minestom. When releaseVersion in spark-minestom/gradle.properties is not published yet, the
# push also publishes it to the maven branch, a Maven repository served from
# https://raw.githubusercontent.com/WindPvP/spark/maven/. Published versions are never overwritten.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "minestom-${{ github.ref }}"

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    permissions:
      # only used to push releases to the maven branch
      contents: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: "Setup JDK 25"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          gradle-version: "wrapper"

      - name: "spark-common's declared dependencies"
        run: |
          BASE=https://repo.lucko.me/me/lucko/spark-common/1.10.165-SNAPSHOT
          STAMP="$(curl -sSf "$BASE/maven-metadata.xml" | sed -n 's:.*<value>\(.*\)</value>.*:\1:p' | head -1)"
          echo "spark-common $STAMP"
          curl -sSf "$BASE/spark-common-$STAMP.pom" | sed -n '/<dependencies>/,/<\/dependencies>/p'
          for repo in https://repo.lucko.me https://repo.maven.apache.org/maven2 https://central.sonatype.com/repository/maven-snapshots; do
            echo "$repo: $(curl -s -o /dev/null -w '%{http_code}' "$repo/net/kyori/adventure-text-feature-pagination/maven-metadata.xml")"
            curl -s "$repo/net/kyori/adventure-text-feature-pagination/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | tail -3
          done

      - name: "Libraries bundled into the jar"
        run: ./gradlew -q :spark-minestom:dependencies --configuration runtimeClasspath

      - name: "Build"
        run: ./gradlew :spark-minestom:assemble :spark-minestom:testClasses :spark-minestom:publish

      - name: "List the published files"
        run: find spark-minestom/build/repo -type f | sort

      - name: "Check out the maven branch"
        id: maven
        if: github.event_name != 'pull_request'
        run: |
          VERSION="$(sed -n 's/^releaseVersion=//p' spark-minestom/gradle.properties)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git fetch --depth 1 origin maven; then
            git worktree add maven-repo FETCH_HEAD
          else
            git worktree add --orphan -b maven maven-repo
            printf '%s\n' "# WindPvP Maven repository" "" \
              "Builds of spark-minestom from this repository, published by the Minestom workflow. Use it as" \
              "\`https://raw.githubusercontent.com/WindPvP/spark/maven/\`." > maven-repo/README.md
          fi
          if [ -e "maven-repo/ga/windpvp/spark-minestom/$VERSION" ]; then
            echo "spark-minestom $VERSION is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Publish the release"
        if: steps.maven.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.maven.outputs.version }}
        run: |
          ./gradlew :spark-minestom:publish -PreleaseRepository="$GITHUB_WORKSPACE/maven-repo"
          cd maven-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spark-minestom $VERSION" -m "Built from $GITHUB_SHA"
          git push origin HEAD:refs/heads/maven
