name: Minestom

# Every push builds spark-minestom. Pushing a minestom/<version> tag also publishes that version to the maven
# branch, which is a Maven repository served from https://raw.githubusercontent.com/WindPvP/spark/maven/
on:
  push:
    branches: ["**"]
    tags: ["minestom/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: "minestom-${{ github.ref }}"

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    permissions:
      # only used to push releases to the maven branch
      contents: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1

      - name: "Setup JDK 25"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5.0.1
        with:
          gradle-version: "wrapper"

      - name: "Libraries bundled into the jar"
        run: ./gradlew -q :spark-minestom:dependencies --configuration runtimeClasspath

      - name: "Build"
        run: ./gradlew :spark-minestom:assemble :spark-minestom:testClasses :spark-minestom:publish

      - name: "List the published files"
        run: find spark-minestom/build/repo -type f | sort

      - name: "Inspect the async-profiler natives"
        run: |
          JAR="$(find spark-minestom/build/libs -name 'spark-minestom-*.jar' ! -name '*-plain.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')"
          ls -la "$JAR"
          unzip -l "$JAR" | grep -E '\.so$|one/profiler/AsyncProfiler\.class|lib/asyncprofiler' || true
          mkdir natives && unzip -q -o "$JAR" '*.so' -d natives || true
          find natives -name '*.so' -exec sh -c 'echo "== $1"; strings "$1" | grep -oE "Java_[A-Za-z0-9_]+AsyncProfiler_[A-Za-z0-9_]+" | sort -u | head -5' _ {} \;
          unzip -l "$JAR" | awk '{print $4}' | grep '/' | cut -d/ -f1-4 | sort -u | head -60

      - name: "Check out the maven branch"
        if: startsWith(github.ref, 'refs/tags/minestom/')
        run: |
          VERSION="${GITHUB_REF_NAME#minestom/}"
          if git fetch --depth 1 origin maven; then
            git worktree add maven-repo FETCH_HEAD
          else
            git worktree add --orphan -b maven maven-repo
            printf '%s\n' "# WindPvP Maven repository" "" \
              "Builds of spark-minestom from the minestom/* tags of this repository. Use it as" \
              "\`https://raw.githubusercontent.com/WindPvP/spark/maven/\`." > maven-repo/README.md
          fi
          if [ -e "maven-repo/ga/windpvp/spark-minestom/$VERSION" ]; then
            echo "::error::spark-minestom $VERSION is already published, tag a new version"
            exit 1
          fi

      - name: "Publish the release"
        if: startsWith(github.ref, 'refs/tags/minestom/')
        run: |
          VERSION="${GITHUB_REF_NAME#minestom/}"
          ./gradlew :spark-minestom:publish -PreleaseVersion="$VERSION" -PreleaseRepository="$GITHUB_WORKSPACE/maven-repo"
          cd maven-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "spark-minestom $VERSION" -m "Built from $GITHUB_SHA"
          git push origin HEAD:refs/heads/maven
